<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products — NEXUS Store</title>
  <meta name="description" content="Browse our full catalog of premium products. Filter by category, search, and sort to find exactly what you need." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div id="toast-container" aria-live="polite"></div>

<!-- ── Navbar ── -->
<nav class="navbar" id="navbar" role="navigation" aria-label="Main navigation">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">⚡</div>
      NEXUS<span>Store</span>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html" class="active">Products</a></li>
      <li><a href="products.html?cat=Electronics">Electronics</a></li>
      <li><a href="products.html?cat=Accessories">Accessories</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="nav-btn" title="Cart" aria-label="Shopping cart" id="nav-cart-btn">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="index.html">Home</a>
  <a href="products.html" class="active">All Products</a>
  <a href="products.html?cat=Electronics">Electronics</a>
  <a href="products.html?cat=Accessories">Accessories</a>
  <a href="cart.html">Shopping Cart</a>
</div>

<!-- ── Page Header ── -->
<header class="page-header" aria-label="Page header">
  <div class="container">
    <h1>All Products</h1>
    <p style="color:var(--text-secondary);font-size:.95rem;margin-top:4px;">Discover our premium collection</p>
    <div class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <i class="fa-solid fa-chevron-right"></i>
      <span>Products</span>
    </div>
  </div>
</header>

<main style="padding-top:32px;padding-bottom:80px;">
  <div class="container">

    <!-- ── Search ── -->
    <div class="search-wrap mb-24 reveal" style="max-width:520px;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="search"
        id="product-search"
        class="search-input"
        placeholder="Search products, categories, brands…"
        aria-label="Search products"
      />
    </div>

    <!-- ── Filter Bar ── -->
    <div class="filter-bar reveal" role="toolbar" aria-label="Product filters">
      <div class="filter-group">
        <span class="filter-label">Category:</span>
        <div class="filter-chips" role="group" aria-label="Category filters">
          <button class="filter-chip active" data-cat="All" aria-pressed="true">All</button>
          <button class="filter-chip" data-cat="Electronics" aria-pressed="false">Electronics</button>
          <button class="filter-chip" data-cat="Computers" aria-pressed="false">Computers</button>
          <button class="filter-chip" data-cat="Accessories" aria-pressed="false">Accessories</button>
          <button class="filter-chip" data-cat="Footwear" aria-pressed="false">Footwear</button>
          <button class="filter-chip" data-cat="Beauty" aria-pressed="false">Beauty</button>
          <button class="filter-chip" data-cat="Photography" aria-pressed="false">Photography</button>
        </div>
      </div>
      <div class="filter-divider" role="separator"></div>
      <div class="filter-group">
        <span class="filter-label">Sort:</span>
        <select id="sort-select" class="sort-select" aria-label="Sort products">
          <option value="default">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="reviews">Most Reviewed</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      <div style="margin-left:auto;">
        <span id="product-count" style="font-size:.82rem;color:var(--text-muted);">8 products</span>
      </div>
    </div>

    <!-- ── Products Grid ── -->
    <div class="products-grid" id="products-grid" role="list" aria-label="Products list"></div>

  </div>
</main>

<!-- ── Footer ── -->
<footer class="footer" role="contentinfo">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <p>© 2026 NEXUS Store. All rights reserved.</p>
      <div style="display:flex;gap:16px;">
        <a href="index.html" style="color:var(--purple-light);font-size:.85rem;">Home</a>
        <a href="cart.html" style="color:var(--purple-light);font-size:.85rem;">Cart</a>
        <a href="#" style="color:var(--purple-light);font-size:.85rem;">Support</a>
      </div>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/pricing.js"></script>
<script src="js/main.js"></script>
</body>
</html>
